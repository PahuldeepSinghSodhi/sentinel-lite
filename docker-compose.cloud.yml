services:
  api:
    build: ./backend
    env_file: ./backend/.env.cloud
    environment:
      SENTINEL_MODE: cloud
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    build: ./backend
    command: python -m app.cloud.worker
    env_file: ./backend/.env.cloud
    environment:
      SENTINEL_MODE: cloud
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    env_file: ./backend/.env.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
