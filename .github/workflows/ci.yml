# ============================================================================
# Sentinel-Lite CI -- Automated Regression Testing
# ============================================================================
# This workflow runs on every push and pull request to ensure:
#   1. All unit/integration tests pass (test_comprehensive.py)
#   2. The 20-question RAG evaluation harness passes (test_evaluation.py)
#   3. Anomaly detection precision/recall/F1 remain above thresholds
#
# Note: The RAG evaluation runs in "retrieval-only" mode in CI because
# Ollama (the local LLM) is not available in GitHub Actions runners.
# It still validates that the correct documents are retrieved for each
# question, which catches regressions in ingestion, chunking, and
# vector search. Full LLM-grounded evaluation runs locally.
# ============================================================================

name: Sentinel-Lite CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run Tests & Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # ---- Unit & Integration Tests ----
      - name: Run comprehensive test suite
        working-directory: backend
        run: python -m tests.test_comprehensive

      # ---- Anomaly Detection Tests ----
      - name: Run anomaly detection tests
        working-directory: backend
        run: python -m tests.test_anomaly

      # ---- Confidence Scoring Tests ----
      - name: Run confidence scoring tests
        working-directory: backend
        run: python -m tests.test_confidence

      # ---- 20-Question Evaluation Harness ----
      # Runs in retrieval-only mode (no Ollama in CI).
      # Validates document retrieval recall across all 20 questions.
      - name: Run 20-question evaluation harness
        working-directory: backend
        run: python -m tests.test_evaluation
